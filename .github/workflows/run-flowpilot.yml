name: Run Flowpilot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install flowpilot
        run: pip install "git+https://github.com/mrzroot/flowpilot.git"

      - name: Init flowpilot project
        run: |
          flowpilot init project
          mkdir -p project/workflows

      - name: Create workflow config
        env:
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > project/workflows/rss-to-telegram.yaml << 'EOF'
          name: rss-to-telegram
          description: Mirror RSS feed into Telegram channel
          tags: [rss, telegram]
          trigger:
            type: feed
            url: https://qamarsyria.github.io/qamar-cloud-farm/feed.xml
            interval: 900
            initial: skip
          steps:
            - id: post
              type: telegram
              retry: { attempts: 3, delay: 10 }
              with:
                chat_id: "PLACEHOLDER_CHAT_ID"
                disable_preview: false
                text: |
                  {{ trigger.entry.title }}
                  {{ trigger.entry.link }}
          EOF
          sed -i "s|PLACEHOLDER_CHAT_ID|${CHAT_ID}|g" project/workflows/rss-to-telegram.yaml

      - name: Run flowpilot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          cd project
          flowpilot run rss-to-telegram
